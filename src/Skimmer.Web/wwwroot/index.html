<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RtlFt8Skimmer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg:#15181e; --panel:#1a1d23; --panel2:#22262e; --line:#3a3f4a; --fg:#e6e6e6; --dim:#8a92a0; --accent:#ff6b6b; --ok:#8fe38f; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.4 "Segoe UI", system-ui, sans-serif; }
  body { display:grid; grid-template-rows:auto 1fr auto; }
  header { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--line); }
  header label { display:flex; align-items:center; gap:6px; }
  input[type=text], input[type=number], select { background:var(--panel2); color:var(--fg); border:1px solid var(--line); border-radius:3px; padding:3px 6px; }
  input.call { width:90px; font-weight:600; text-transform:uppercase; }
  input.grid { width:72px; } input.num { width:52px; } input.path { width:180px; }
  button { background:#2d333d; color:var(--fg); border:1px solid var(--line); border-radius:3px; padding:4px 12px; cursor:pointer; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  #startBtn.running { background:#5a2a2a; }
  main { display:grid; grid-template-columns:150px 1fr 5px minmax(360px, 560px); min-height:0; gap:0 8px; padding:8px; }
  #bands h3, .title { margin:0 0 6px; font-size:13px; font-weight:600; }
  .band { display:flex; align-items:center; gap:6px; padding:3px 4px; border-radius:4px; margin:1px 0; }
  .band.active { background:#2f4f2f; }
  .band .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  .band .cnt { margin-left:auto; color:var(--dim); }
  .hint { color:var(--dim); font-size:11px; margin-top:10px; }
  #center { display:grid; grid-template-rows:1fr auto 170px; min-height:0; min-width:0; }
  #map { border:1px solid var(--line); min-height:240px; background:#0e1116; }
  .wfhead { display:flex; justify-content:space-between; margin:6px 0 2px; color:var(--dim); font-size:11px; }
  .wfhead b { color:var(--fg); font-size:13px; }
  #wf { width:100%; height:100%; border:1px solid var(--line); background:#000; image-rendering:pixelated; display:block; }
  #decodes { overflow:auto; background:var(--panel); border:1px solid var(--line); min-height:0; }
  table { width:100%; border-collapse:collapse; font:12px Consolas, "DejaVu Sans Mono", monospace; }
  th { position:sticky; top:0; background:var(--panel2); color:#c0c6d0; font:12px "Segoe UI", system-ui, sans-serif; text-align:left; padding:4px 6px; }
  td { padding:2px 6px; white-space:nowrap; }
  tr:nth-child(even) td { background:#1f232a; }
  tr.cq td { color:var(--ok); }
  tr.me td { background:#5a2a2a !important; font-weight:700; }
  td.msg { white-space:normal; }
  footer { display:flex; justify-content:space-between; gap:10px; padding:4px 10px; background:#0f1115; color:#a8b0bc; }
  footer .me { color:var(--accent); font-weight:600; }
  #error { color:#ffb4b4; }
  .legend { background:rgba(14,17,22,.85); color:#e6e6e6; padding:6px 10px; border-radius:6px; font:12px/1.5 "Segoe UI", sans-serif; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
  .dark-tiles { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6); }
  @media (max-width: 900px) {
    main { grid-template-columns:1fr; grid-auto-rows:auto; }
    #split { display:none; }
    #bands { display:flex; flex-wrap:wrap; gap:4px 10px; } #bands h3, #bands .hint { width:100%; }
    #center { grid-template-rows:320px auto 140px; }
    #decodes { max-height:50vh; }
  }
</style>
</head>
<body>
<header>
  <label>Callsign <input id="call" class="call" type="text" maxlength="12"></label>
  <label>Locator <input id="grid" class="grid" type="text" maxlength="6"></label>
  <label>Gain <select id="gain"></select></label>
  <label>ppm <input id="ppm" class="num" type="number"></label>
  <label><input id="bias" type="checkbox"> Bias-T</label>
  <label><input id="invert" type="checkbox"> Invert IQ</label>
  <label>Slots/band <select id="dwell"><option>1</option><option>2</option><option>4</option></select></label>
  <label>jt9 <input id="jt9" class="path" type="text"></label>
  <label><input id="psk" type="checkbox"> PSKReporter</label>
  <label><input id="psktest" type="checkbox"> test server</label>
  <button id="startBtn">▶ Start</button>
  <span id="error"></span>
</header>

<main>
  <section id="bands"><h3>Bands</h3><div id="bandList"></div>
    <div class="hint">Below 28.8 MHz the V4 uses its built-in upconverter. Connect an HF antenna.</div></section>
  <section id="center">
    <div id="map"></div>
    <div class="wfhead"><b id="wfLabel">Waterfall</b><span>0 Hz … 3000 Hz</span></div>
    <canvas id="wf" width="512" height="240"></canvas>
  </section>
  <div id="split"></div>
  <section id="decodes">
    <table><thead><tr><th>UTC</th><th>Band</th><th>dB</th><th>DT</th><th>Hz</th><th>Message</th><th>km</th></tr></thead>
    <tbody id="rows"></tbody></table>
  </section>
</main>

<footer><span id="status">Connecting…</span><span class="me" id="me"></span></footer>

<script>
const R828D = [0.0,0.9,1.4,2.7,3.7,7.7,8.7,12.5,14.4,15.7,16.6,19.7,20.7,22.9,25.4,28.0,29.7,32.8,33.8,36.4,37.2,38.6,40.2,42.1,43.4,43.9,44.5,48.0,49.6];
const $ = id => document.getElementById(id);
let bands = [], settings = null, running = false, homeLatLng = null, home = null, slotBand = null;
const stations = new Map();
const MAX_ROWS = 2000, MAX_AGE_MS = 30 * 60 * 1000;

// ---------- map ----------
const map = L.map('map', { worldCopyJump: true }).setView([30, 20], 2);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 10, className: 'dark-tiles', attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);
const legend = L.control({ position: 'bottomleft' });
legend.onAdd = () => L.DomUtil.create('div', 'legend');
legend.addTo(map);

function arc(a, b, n = 48) {
  const r = Math.PI / 180, d = 180 / Math.PI;
  const [la1, lo1, la2, lo2] = [a[0] * r, a[1] * r, b[0] * r, b[1] * r];
  const w = 2 * Math.asin(Math.sqrt(Math.sin((la2 - la1) / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin((lo2 - lo1) / 2) ** 2));
  if (w < 1e-6) return [a, b];
  const pts = []; let prev = null;
  for (let i = 0; i <= n; i++) {
    const f = i / n, A = Math.sin((1 - f) * w) / Math.sin(w), B = Math.sin(f * w) / Math.sin(w);
    const x = A * Math.cos(la1) * Math.cos(lo1) + B * Math.cos(la2) * Math.cos(lo2);
    const y = A * Math.cos(la1) * Math.sin(lo1) + B * Math.cos(la2) * Math.sin(lo2);
    const z = A * Math.sin(la1) + B * Math.sin(la2);
    let lon = Math.atan2(y, x) * d;
    if (prev !== null) { while (lon - prev > 180) lon -= 360; while (lon - prev < -180) lon += 360; }
    prev = lon;
    pts.push([Math.atan2(z, Math.sqrt(x * x + y * y)) * d, lon]);
  }
  return pts;
}

function gridToLatLon(g) {
  if (!/^[A-R]{2}[0-9]{2}([A-X]{2})?$/i.test(g || '')) return null;
  g = g.toUpperCase();
  let lon = (g.charCodeAt(0) - 65) * 20 - 180 + (g.charCodeAt(2) - 48) * 2;
  let lat = (g.charCodeAt(1) - 65) * 10 - 90 + (g.charCodeAt(3) - 48);
  if (g.length >= 6) { lon += (g.charCodeAt(4) - 65) * 2 / 24 + 1 / 24; lat += (g.charCodeAt(5) - 65) / 24 + 0.5 / 24; }
  else { lon += 1; lat += 0.5; }
  return [lat, lon];
}

function setHome(grid, call) {
  const ll = gridToLatLon(grid);
  if (!ll) return;
  homeLatLng = ll;
  if (home) home.remove();
  home = L.circleMarker(ll, { radius: 7, color: '#fff', weight: 2, fillColor: '#ff3b3b', fillOpacity: 1 })
    .bindTooltip(call, { permanent: true, direction: 'right' }).addTo(map);
  map.setView(ll, 3);
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }

function mapSpot(s) {
  if (!homeLatLng || s.lat == null || !s.call) return;
  const key = s.call + '|' + s.band;
  const old = stations.get(key);
  if (old) { old.line.remove(); old.dot.remove(); }
  const pts = arc(homeLatLng, [s.lat, s.lon]);
  const line = L.polyline(pts, { color: s.color, weight: 1.6, opacity: .8 }).addTo(map);
  const dot = L.circleMarker(pts.at(-1), { radius: 4, color: s.color, fillColor: s.color, fillOpacity: .9, weight: 1 })
    .bindPopup(`<b>${esc(s.call)}</b> ${esc(s.band)}<br>${s.snr} dB${s.km != null ? ' · ' + s.km + ' km' : ''}<br>${esc(s.utc)} UTC<br><code>${esc(s.msg)}</code>`)
    .addTo(map);
  stations.set(key, { line, dot, band: s.band, t: Date.now() });
}

function renderLegend(perBand) {
  const div = document.querySelector('.legend');
  div.innerHTML = '<b>Stations (30′)</b><br>' + bands.map(b =>
    `<div><i style="background:${b.color}"></i>${b.name}: ${perBand?.[b.name] || 0}</div>`).join('');
}

setInterval(() => {
  const now = Date.now();
  stations.forEach((v, k) => { if (now - v.t > MAX_AGE_MS) { v.line.remove(); v.dot.remove(); stations.delete(k); } });
}, 30000);

// ---------- waterfall ----------
const wf = $('wf'), wctx = wf.getContext('2d');
const palette = (() => {
  const stops = [[0, 0, 0, 0], [.3, 10, 20, 120], [.55, 0, 170, 200], [.8, 250, 220, 30], [1, 255, 255, 255]];
  const p = new Uint8ClampedArray(256 * 3);
  for (let i = 0; i < 256; i++) {
    const t = i / 255; let k = 0; while (k < stops.length - 2 && t > stops[k + 1][0]) k++;
    const a = stops[k], b = stops[k + 1], f = (t - a[0]) / (b[0] - a[0]);
    for (let c = 0; c < 3; c++) p[i * 3 + c] = a[c + 1] + (b[c + 1] - a[c + 1]) * f;
  }
  return p;
})();
const lineImg = wctx.createImageData(512, 1);
function wfScroll() { wctx.drawImage(wf, 0, 0, 512, 239, 0, 1, 512, 239); }
function wfLine(bytes) {
  wfScroll();
  for (let x = 0; x < 512; x++) {
    const v = bytes[x], o = x * 4;
    lineImg.data[o] = palette[v * 3]; lineImg.data[o + 1] = palette[v * 3 + 1]; lineImg.data[o + 2] = palette[v * 3 + 2]; lineImg.data[o + 3] = 255;
  }
  wctx.putImageData(lineImg, 0, 0);
}
function wfMarker(color) { wfScroll(); wctx.fillStyle = color; wctx.fillRect(0, 0, 512, 1); }
wctx.fillStyle = '#000'; wctx.fillRect(0, 0, 512, 240);

// ---------- bands, decodes ----------
let lastPerBand = {};
function renderBands(perBand) {
  if (perBand) lastPerBand = perBand; else perBand = lastPerBand;
  // κρατά τις επιλογές του χρήστη που δεν έχουν σταλεί ακόμη στον διακομιστή
  const boxes = document.querySelectorAll('#bandList input');
  const chosen = boxes.length ? new Set([...boxes].filter(i => i.checked).map(i => i.dataset.band)) : new Set(settings?.bands || []);
  $('bandList').innerHTML = bands.map(b => `
    <label class="band${slotBand === b.name ? ' active' : ''}">
      <span class="dot" style="background:${b.color}"></span>
      <input type="checkbox" data-band="${b.name}" ${chosen.has(b.name) ? 'checked' : ''} ${running ? 'disabled' : ''}> ${b.name}
      <span class="cnt">${perBand?.[b.name] || ''}</span>
    </label>`).join('');
}

function addRow(s) {
  const tr = document.createElement('tr');
  if (s.cq) tr.className = 'cq';
  if (s.forMe) tr.className = 'me';
  tr.innerHTML = `<td>${esc(s.utc)}</td><td>${esc(s.band)}</td><td>${s.snr}</td><td>${s.dt.toFixed(1)}</td><td>${s.hz}</td><td class="msg">${esc(s.msg)}</td><td>${s.km ?? ''}</td>`;
  const rows = $('rows');
  rows.insertBefore(tr, rows.firstChild);
  while (rows.children.length > MAX_ROWS) rows.removeChild(rows.lastChild);
}

// ---------- settings ----------
function fillSettings(s) {
  settings = s;
  $('call').value = s.myCall; $('grid').value = s.myGrid; $('ppm').value = s.ppm;
  $('bias').checked = s.biasTee; $('invert').checked = s.invertSpectrum;
  $('dwell').value = String(s.dwellSlots); $('jt9').value = s.jt9Path;
  $('psk').checked = s.pskReporter; $('psktest').checked = s.pskReporterTest;
  $('gain').value = s.gainDb < 0 ? 'auto' : String(R828D.reduce((a, g) => Math.abs(g - s.gainDb) < Math.abs(a - s.gainDb) ? g : a, R828D[0]));
  $('me').textContent = s.myCall;
  setHome(s.myGrid, s.myCall);
}

function readSettings() {
  return {
    ...settings,
    myCall: $('call').value.trim().toUpperCase(), myGrid: $('grid').value.trim(),
    gainDb: $('gain').value === 'auto' ? -1 : parseFloat($('gain').value),
    ppm: parseInt($('ppm').value || '0', 10), biasTee: $('bias').checked, invertSpectrum: $('invert').checked,
    dwellSlots: parseInt($('dwell').value, 10), jt9Path: $('jt9').value.trim(),
    pskReporter: $('psk').checked, pskReporterTest: $('psktest').checked,
    bands: [...document.querySelectorAll('#bandList input:checked')].map(i => i.dataset.band),
  };
}

$('gain').innerHTML = '<option value="auto">Auto</option>' + R828D.map(g => `<option>${g.toFixed(1)}</option>`).join('');

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).error || m; } catch { } throw new Error(m); }
}

$('startBtn').onclick = async () => {
  $('error').textContent = '';
  try {
    if (running) { await post('/api/stop'); return; }
    const s = readSettings();
    await post('/api/settings', s);
    fillSettings(s);
    await post('/api/start');
  } catch (e) { $('error').textContent = e.message; }
};

function setRunning(r) {
  running = r;
  $('startBtn').textContent = r ? '■ Stop' : '▶ Start';
  $('startBtn').classList.toggle('running', r);
  document.querySelectorAll('header input, header select').forEach(el => el.disabled = r);
  document.querySelectorAll('#bandList input').forEach(el => el.disabled = r);
}

// ---------- live connection ----------
function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.binaryType = 'arraybuffer';
  ws.onmessage = ev => {
    if (ev.data instanceof ArrayBuffer) { wfLine(new Uint8Array(ev.data)); return; }
    const m = JSON.parse(ev.data);
    switch (m.t) {
      case 'hello':
        bands = m.bands; fillSettings(m.settings); $('bandList').innerHTML = ''; renderBands(); renderLegend();
        $('rows').innerHTML = ''; m.recent.forEach(s => { addRow(s); mapSpot(s); });
        document.title = `RtlFt8Skimmer ${m.version} · ${m.settings.myCall}`;
        break;
      case 'status': {
        setRunning(m.running);
        if (m.band !== slotBand && m.band) slotBand = m.band;
        renderBands(m.perBand); renderLegend(m.perBand);
        const sec = ((Date.now() / 1000) % 15).toFixed(1);
        $('status').textContent = m.running
          ? `${new Date().toISOString().substring(11, 19)} UTC · slot ${sec}/15 s · ${m.band ?? '-'} · stations 30′: ${m.stations} · total: ${m.total} · ${m.log}`
          : `Ready. ${m.log}`;
        break;
      }
      case 'slot': {
        slotBand = m.band;
        $('wfLabel').textContent = `Waterfall · ${m.band} · ${(m.dial / 1e6).toFixed(3)} MHz`;
        wfMarker(m.color); renderBands();
        break;
      }
      case 'spot': addRow(m); mapSpot(m); break;
    }
  };
  ws.onclose = () => { $('status').textContent = 'Disconnected, retrying…'; setTimeout(connect, 2000); };
}
connect();
</script>
</body>
</html>
